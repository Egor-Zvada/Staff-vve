server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name staff.vve.local staff 192.168.110.202 staff-v2;
    root /opt/staff-v2/app/public;
    index index.php;
    ssl_certificate /etc/staff-v2/server.crt;
    ssl_certificate_key /etc/staff-v2/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 10m;
    access_log /var/log/nginx/staff-v2-access.log;
    error_log /var/log/nginx/staff-v2-error.log;
    location / { try_files $uri /index.php$is_args$args; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/staff-v2.sock;
        fastcgi_read_timeout 90s;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
    location /assets/ { try_files $uri =404; add_header X-Content-Type-Options nosniff; }
}
